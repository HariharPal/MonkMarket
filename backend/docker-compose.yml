services:

  postgres:
    image: postgres:16
    container_name: monkmarket-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: monkmarket

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USERNAME:-postgres} -d monkmarket"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - monkmarket-network

  service-registry:
    build:
      context: ./service-registry

    container_name: monkmarket-service-registry
    restart: unless-stopped

    ports:
      - "8761:8761"

    environment:
      SERVER_PORT: 8761
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"

    networks:
      - monkmarket-network

  gateway-service:
    build:
      context: ./gateway-service

    container_name: monkmarket-gateway
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"

    depends_on:
      service-registry:
        condition: service_started

    networks:
      - monkmarket-network

  identity-service:
    build:
      context: ./identity-service

    container_name: monkmarket-identity
    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:
      SERVER_PORT: 8081

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/monkmarket
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}

      HEALTH_SHOW_DETAILS: ${HEALTH_SHOW_DETAILS:-NEVER}

      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"

    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_started

    networks:
      - monkmarket-network

  commerce-service:
    build:
      context: ./commerce-service

    container_name: monkmarket-commerce
    restart: unless-stopped

    ports:
      - "8082:8082"

    environment:
      SERVER_PORT: 8082

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/monkmarket
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/

      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}

      HEALTH_SHOW_DETAILS: ${HEALTH_SHOW_DETAILS:-NEVER}

      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m"

    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_started

    networks:
      - monkmarket-network

  agent-service:
    build:
      context: ./agent-service

    container_name: monkmarket-agent
    restart: unless-stopped

    ports:
      - "8087:8087"

    environment:
      SERVER_PORT: 8087

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/monkmarket
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite-preview}

      COMMERCE_SERVICE_URL: http://commerce-service:8082

      HEALTH_SHOW_DETAILS: ${HEALTH_SHOW_DETAILS:-NEVER}

      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m"

    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_started
      commerce-service:
        condition: service_started

    networks:
      - monkmarket-network

volumes:
  postgres_data:

networks:
  monkmarket-network:
    driver: bridge