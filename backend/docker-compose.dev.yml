services:
  postgres:
    image: postgres:16
    container_name: monkmarket-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: monkmarket
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monkmarket"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
