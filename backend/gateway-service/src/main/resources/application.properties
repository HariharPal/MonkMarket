spring.application.name=gateway-service
server.port=${SERVER_PORT:8080}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

spring.cloud.gateway.server.webmvc.discovery.locator.enabled=false

management.endpoints.web.exposure.include=health,info,metrics

spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=catalog-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://catalog-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/catalog/**

spring.cloud.gateway.server.webmvc.routes[2].id=agent-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://agent-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/agent/**

spring.cloud.gateway.server.webmvc.routes[3].id=order-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://order-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/orders/**

spring.cloud.gateway.server.webmvc.routes[4].id=audit-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://audit-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/v1/audit/**

spring.cloud.gateway.server.webmvc.routes[5].id=cart-service
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://CART-SERVICE
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/v1/cart/**

spring.cloud.gateway.server.webmvc.routes[6].id=payment-service
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://payment-service
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/v1/payments/**